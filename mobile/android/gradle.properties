org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# The version people read, and Google Play's version code (must rise with every upload; pass -PvmkBuildNumber=N for a release).
vmkVersionName=0.1.0
vmkBuildNumber=1

# Social sign-in buttons (no value here on purpose, see app/build.gradle.kts): Google is ON when the build points at the production backend (-PvmkProdApiBase=...)
# and OFF against QA (QA has no Google client yet); Apple is OFF until Apple credentials exist. Override per build: -PvmkAuthGoogle=true|false -PvmkAuthApple=true|false.
