org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# The version people read, and Google Play's version code (must rise with every upload; pass -PvmkBuildNumber=N for a release).
vmkVersionName=0.1.0
vmkBuildNumber=1

# Social sign-in buttons: OFF. Turn on per build with -PvmkAuthGoogle=true -PvmkAuthApple=true once the Cognito identity providers exist.
vmkAuthGoogle=false
vmkAuthApple=false
