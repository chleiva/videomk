name: VideoMK
configs:
  Debug: debug
  Beta: release     # TestFlight: Release-compiled (no debug code), pointed at the QA backend
  Release: release  # App Store: production backend (not deployed yet)
options:
  bundleIdPrefix: com.videomk
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  VideoMKCore:
    path: Packages/VideoMKCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 39ANXJNUTL   # Agilegency Ltd
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VideoMK:
    type: application
    platform: iOS
    sources: [VideoMK]
    dependencies:
      - package: VideoMKCore
    info:
      path: VideoMK/Info.plist
      properties:
        CFBundleDisplayName: videomk
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]    # the app speaks English and Spanish (docs/I18N.md); iOS Settings > videomk > Language lists both
        UILaunchScreen:
          UIColorName: LaunchBackground
        # iPhone is portrait. The full-screen player alone turns sideways, through AppDelegate.supportedInterfaceOrientationsFor (OrientationLock).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.videomk.app.auth
            CFBundleURLSchemes: [com.videomk.app]
        ITSAppUsesNonExemptEncryption: false
        # "Tell me when it's ready": a look at the list when iOS grants a background refresh (there is no push from the server yet)
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.videomk.app.ready]
        NSPhotoLibraryAddUsageDescription: videomk saves a finished video to your Photos only when you tap Save to Photos.
        NSMicrophoneUsageDescription: videomk uses the microphone only while you hold dictation on, so you can say what video you want instead of typing it.
        NSSpeechRecognitionUsageDescription: videomk turns your speech into text for your video brief. Where your iPhone supports it, this happens on the device.
        VMKApiBase: $(VMK_API_BASE)
        VMKAuthDomain: $(VMK_AUTH_DOMAIN)
        VMKClientID: $(VMK_CLIENT_ID)
        VMKAuthApple: $(VMK_AUTH_APPLE)    # "Continue with Apple" button; YES only after the backend federation is live
        VMKAuthGoogle: $(VMK_AUTH_GOOGLE)  # "Continue with Google" button
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videomk.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # Social sign-in switches, OFF in every configuration. Turn one on per configuration below, or per build:
        #   xcodebuild ... VMK_AUTH_GOOGLE=YES VMK_AUTH_APPLE=YES
        VMK_AUTH_APPLE: "NO"
        VMK_AUTH_GOOGLE: "NO"
      configs:
        Debug:  # QA backend (account 552357225438, eu-west-1)
          VMK_API_BASE: https://rj1uhfqld0.execute-api.eu-west-1.amazonaws.com/prod
          VMK_AUTH_DOMAIN: https://videomk-qa-225438.auth.eu-west-1.amazoncognito.com
          VMK_CLIENT_ID: 5j3hia3hdqa5g3gob8np0t5421
        Beta:  # same QA backend as Debug
          VMK_API_BASE: https://rj1uhfqld0.execute-api.eu-west-1.amazonaws.com/prod
          VMK_AUTH_DOMAIN: https://videomk-qa-225438.auth.eu-west-1.amazoncognito.com
          VMK_CLIENT_ID: 5j3hia3hdqa5g3gob8np0t5421
        Release:  # production is not deployed yet: the app shows "not configured" until these are filled in
          VMK_API_BASE: ""
          VMK_AUTH_DOMAIN: ""
          VMK_CLIENT_ID: ""
  VideoMKUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VideoMKUITests]
    dependencies:
      - target: VideoMK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videomk.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VideoMK
schemes:
  VideoMK-TestFlight:
    build:
      targets:
        VideoMK: all
    archive:
      config: Beta
  VideoMK:
    build:
      targets:
        VideoMK: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [VideoMKUITests]
