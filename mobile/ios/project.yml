name: VideoMK
configs:
  Debug: debug
  Beta: release     # TestFlight: Release-compiled (no debug code), pointed at the QA backend
  Release: release  # App Store: production backend (not deployed yet)
options:
  bundleIdPrefix: com.videomk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  VideoMKCore:
    path: Packages/VideoMKCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 39ANXJNUTL   # Agilegency Ltd
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VideoMK:
    type: application
    platform: iOS
    sources: [VideoMK]
    dependencies:
      - package: VideoMKCore
    info:
      path: VideoMK/Info.plist
      properties:
        CFBundleDisplayName: videomk
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.videomk.app.auth
            CFBundleURLSchemes: [com.videomk.app]
        ITSAppUsesNonExemptEncryption: false
        VMKApiBase: $(VMK_API_BASE)
        VMKAuthDomain: $(VMK_AUTH_DOMAIN)
        VMKClientID: $(VMK_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videomk.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:  # QA backend (account 552357225438, eu-west-1)
          VMK_API_BASE: https://rj1uhfqld0.execute-api.eu-west-1.amazonaws.com/prod
          VMK_AUTH_DOMAIN: https://videomk-qa-225438.auth.eu-west-1.amazoncognito.com
          VMK_CLIENT_ID: 5j3hia3hdqa5g3gob8np0t5421
        Beta:  # same QA backend as Debug
          VMK_API_BASE: https://rj1uhfqld0.execute-api.eu-west-1.amazonaws.com/prod
          VMK_AUTH_DOMAIN: https://videomk-qa-225438.auth.eu-west-1.amazoncognito.com
          VMK_CLIENT_ID: 5j3hia3hdqa5g3gob8np0t5421
        Release:  # production is not deployed yet: the app shows "not configured" until these are filled in
          VMK_API_BASE: ""
          VMK_AUTH_DOMAIN: ""
          VMK_CLIENT_ID: ""
  VideoMKUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VideoMKUITests]
    dependencies:
      - target: VideoMK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videomk.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VideoMK
schemes:
  VideoMK-TestFlight:
    build:
      targets:
        VideoMK: all
    archive:
      config: Beta
  VideoMK:
    build:
      targets:
        VideoMK: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [VideoMKUITests]
